<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - BeautifulKost</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0047bb;
            --bg-gray: #f8faff;
            --text-muted: #666;
            --input-bg: #f1f3f7;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            max-width: 430px;
            width: 100%;
            background: var(--bg-gray);
            min-height: 100vh;
            position: relative;
            padding-bottom: 90px;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        /* Top Header Navigation */
        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }
        .back-arrow {
            font-size: 18px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
        }
        .bell-icon { font-size: 18px; color: #333; }

        /* Profile Avatar Area */
        .avatar-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 10px auto;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-blue);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid white;
            cursor: pointer;
        }
        .user-title { font-size: 16px; font-weight: 700; color: #222; margin: 0; }
        .resident-id { font-size: 12px; color: #999; margin: 3px 0 0 0; }

        .content { padding: 0 20px; }

        /* Status Cards */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .status-card {
            background: white;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #f0f0f0;
        }
        .status-icon { font-size: 18px; }
        .status-info { display: flex; flex-direction: column; }
        .status-label { font-size: 11px; color: #aaa; font-weight: 600; }
        .status-value { font-size: 12px; font-weight: 700; color: #333; }
        .status-value.active { color: #10b981; }

        /* Form Styling */
        .form-section-title {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin: 15px 0 10px 0;
        }
        .input-group {
            background: white;
            border-radius: 14px;
            padding: 10px 15px;
            margin-bottom: 12px;
            border: 1px solid #f0f0f0;
        }
        .input-label {
            font-size: 11px;
            color: #aaa;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .field-icon { font-size: 14px; color: #888; }
        .form-control {
            border: none;
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            outline: none;
            background: transparent;
        }

        /* Textarea Alamat */
        .address-box {
            min-height: 50px;
            resize: none;
        }

        /* Action Button */
        .btn-save {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(0, 71, 187, 0.15);
        }

        /* BOTTOM NAVIGATION STYLE */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 70px;
            background: white;
            display: flex !important;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            z-index: 1000;
            padding: 0 !important;
            margin: 0 !important;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .nav-item span { color: #bbb; }
        .nav-icon { font-size: 24px; margin-bottom: 2px; line-height: 1; }
        .nav-item span:last-child { font-size: 11px; font-weight: 600; }
        .nav-item.active span { color: var(--primary-blue); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="top-nav-bar">
        <a href="dashboard.html" class="back-arrow">⬅️</a>
        <div class="bell-icon">🔔</div>
    </div>

    <div class="avatar-section">
        <div class="avatar-wrapper">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="profile-img" alt="Avatar">
            <div class="camera-badge">📸</div>
        </div>
        <h2 class="user-title" id="display-name">Alex Thompson</h2>
        <p class="resident-id">Resident #RP-2044</p>
    </div>

    <div class="content">
        <div class="status-grid">
            <div class="status-card">
                <span class="status-icon">📅</span>
                <div class="status-info">
                    <span class="status-label">Tanggal Masuk</span>
                    <span class="status-value">Oct 12, 2023</span>
                </div>
            </div>
            <div class="status-card">
                <span class="status-icon">🛡️</span>
                <div class="status-info">
                    <span class="status-label">Status Sewa</span>
                    <span class="status-value active">Active</span>
                </div>
            </div>
        </div>

        <div class="form-section-title">Informasi Pribadi</div>
        
        <div class="input-group">
            <span class="input-label">Nama Lengkap</span>
            <div class="input-wrapper">
                <span class="field-icon">👤</span>
                <input type="text" class="form-control" id="input-nama" value="Alex Thompson">
            </div>
        </div>

        <div class="input-group">
            <span class="input-label">No HP</span>
            <div class="input-wrapper">
                <span class="field-icon">📞</span>
                <input type="text" class="form-control" value="+1 (555) 0123-456">
            </div>
        </div>

        <div class="form-section-title">Kontak Darurat / Wali</div>

        <div class="input-group">
            <span class="input-label">Nama Lengkap Wali</span>
            <div class="input-wrapper">
                <span class="field-icon">👤</span>
                <input type="text" class="form-control" value="Alex Thompson">
            </div>
        </div>

        <div class="input-group">
            <span class="input-label">No HP Wali</span>
            <div class="input-wrapper">
                <span class="field-icon">📞</span>
                <input type="text" class="form-control" value="+1 (555) 0123-456">
            </div>
        </div>

        <div class="form-section-title">Alamat Sesuai KTP</div>

        <div class="input-group">
            <span class="input-label">Address (alamat)</span>
            <div class="input-wrapper" style="align-items: flex-start;">
                <span class="field-icon" style="margin-top: 3px;">📍</span>
                <textarea class="form-control address-box">Skyline Towers, Unit 402-B, Downtown Metropolitan District</textarea>
            </div>
        </div>

        <button class="btn-save" id="btn-save">💾 Simpan Perubahan</button>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">🏠</span><span>Utama</span>
        </a>
        <a href="kamar.html" class="nav-item">
            <span class="nav-icon">🏢</span><span>Kamar</span>
        </a>
        <a href="tagihan.html" class="nav-item">
            <span class="nav-icon">🧾</span><span>Tagihan</span>
        </a>
        <a href="bantuan.html" class="nav-item active">
            <span class="nav-icon">💬</span><span>Bantuan</span>
        </a>
    </nav>
</div>

<script>
    // Logic penyimpanan nama agar otomatis mengupdate header page lain
    document.getElementById('btn-save').addEventListener('click', function() {
        const namaBaru = document.getElementById('input-nama').value;
        localStorage.setItem("namaPengguna", namaBaru);
        document.getElementById('display-name').innerText = namaBaru;
        alert('🎉 Perubahan profil berhasil disimpan!');
    });

    // Load nama saat halaman dibuka
    window.onload = function() {
        const namaSimpanan = localStorage.getItem("namaPengguna");
        if (namaSimpanan) {
            document.getElementById('input-nama').value = namaSimpanan;
            document.getElementById('display-name').innerText = namaSimpanan;
        }
    };
</script>

</body>
</html>
