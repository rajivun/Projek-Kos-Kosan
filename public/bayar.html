<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincian Pembayaran - BeautifulKost</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0047bb;
            --bg-gray: #f8faff;
            --text-muted: #777;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }

        body {
            background-color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            max-width: 430px;
            width: 100%;
            background: var(--bg-gray);
            min-height: 100vh;
            position: relative;
            padding-bottom: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        /* Top Bar Info */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #000;
        }
        .user-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary-blue);
        }
        .notif-icon {
            font-size: 18px;
            color: #333;
        }

        /* Main Content */
        .content { padding: 10px 20px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-header h2 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
            color: #222;
        }
        .invoice-badge {
            background: #e0e7ff;
            color: #4338ca;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
        }

        /* Billing Detail Card */
        .billing-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            border: 1px solid #f2f5fa;
            margin-bottom: 20px;
        }
        .bill-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .bill-item span:last-child {
            color: #333;
            font-weight: 600;
        }
        .divider {
            height: 1px;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-label {
            font-size: 18px;
            font-weight: 700;
            color: #222;
        }
        .total-amount {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-blue);
        }

        /* QRIS Box Area */
        .qris-container {
            background: white;
            border: 2px dashed #ddd;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .qris-graphic-box {
            width: 200px;
            height: 200px;
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }
        .qris-placeholder-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            opacity: 0.8;
        }
        .qris-instruction {
            font-size: 13px;
            font-weight: 700;
            color: #222;
            margin: 0 0 4px 0;
        }
        .qris-sub-instruction {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Bottom Final Action Button */
        .btn-secure-pay {
            width: 100%;
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 71, 187, 0.2);
        }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.4;
            padding: 0 15px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 70px;
            background: white;
            display: flex !important;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            z-index: 1000;
            padding: 0 !important;
            margin: 0 !important;
        }

        .nav-item {
            flex: 1;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-decoration: none !important;
            color: #bbb !important; /* Warna abu default */
        }

        .nav-icon {
            font-size: 24px !important; /* UKURAN ICON DIKUNCI */
            margin-bottom: 2px !important;
            line-height: 1 !important;
        }

        .nav-item span:last-child {
            font-size: 11px !important; /* UKURAN TEKS DIKUNCI */
            font-weight: 600 !important;
        }

        .nav-item.active {
            color: #0047bb !important; /* Warna biru aktif */
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar"></div>
            <span class="user-name">Pengguna</span>
        </div>
        <div class="notif-icon">🔔</div>
    </div>

    <div class="content">
        <div class="section-header">
            <h2>Rincian Pembayaran</h2>
            <div class="invoice-badge">Inv #8821</div>
        </div>

        <div class="billing-card">
            <div class="bill-item">
                <span>Sewa Bulanan</span>
                <span>Rp. 11.000.000</span>
            </div>
            <div class="bill-item">
                <span>September 2026</span>
                <span></span>
            </div>
            
            <div class="divider"></div>
            
            <div class="total-row">
                <span class="total-label">Total Amount</span>
                <span class="total-amount">Rp. 11.100.000</span>
            </div>
        </div>

        <div class="qris-container">
            <div class="qris-graphic-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=BeautifulKost" class="qris-placeholder-img" alt="QRIS Code">
            </div>
            <p class="qris-instruction">Scan to pay with QRIS</p>
            <p class="qris-sub-instruction">Total payable: Rp. 11.100.000</p>
        </div>

        <button class="btn-secure-pay" id="btn-done">🔒 Pay Securely</button>
        
        <div class="footer-note">
            Your payment is encrypted and processed securely by UrbanStay financial partners.
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="dashboardtest.html" class="nav-item">
            <span class="nav-icon">🏠</span><span>Utama</span>
        </a>
        <a href="kamar.html" class="nav-item">
            <span class="nav-icon">🏢</span><span>Kamar</span>
        </a>
        <a href="tagihan.html" class="nav-item active">
            <span class="nav-icon">🧾</span><span>Tagihan</span>
        </a>
        <a href="bantuan.html" class="nav-item">
            <span class="nav-icon">💬</span><span>Bantuan</span>
        </a>
    </nav>
</div>

<script>
    // Membaca nama otomatis dari localStorage
    window.onload = function() {
        const namaSimpanan = localStorage.getItem("namaPengguna");
        if (namaSimpanan) {
            document.querySelector(".user-name").innerText = namaSimpanan;
        }
    };

    // Alert sukses simulasi ketika berhasil melakukan pembayaran
    document.getElementById('btn-done').addEventListener('click', function() {
        alert('🎉 Pembayaran Berhasil! Masa sewa kamar Anda telah diperbarui.');
        window.location.href = 'tagihan.html'; // Mengembalikan pengguna ke Dashboard Tagihan
    });
</script>

</body>
</html>
